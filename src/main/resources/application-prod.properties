spring.application.name=sga
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health
sga.seguridad.herramientas-desarrollo=false
sga.usuarios-iniciales.habilitados=false

sga.cors.allowed-origins=${SGA_CORS_ALLOWED_ORIGINS}
sga.jwt.secret=${SGA_JWT_SECRET}
sga.admin.nombre=${SGA_ADMIN_NOMBRE:Administrador}
sga.admin.correo=${SGA_ADMIN_CORREO:}
sga.admin.clave=${SGA_ADMIN_CLAVE:}
